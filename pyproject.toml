[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-loop"
version = "0.1.0"
description = "Self-supervised visual place recognition and loop closure detection using JEPA representations, geometric verification, and reproducible SLAM benchmarks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Harish Natarajan Ravi" }]
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "opencv-python-headless>=4.9,<5",
    "matplotlib>=3.8",
    "Pillow>=10.0",
    "imageio>=2.34",
    "PyYAML>=6.0",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Phase 2+: frozen neural encoders (I-JEPA). Tested with torch 2.15.0 (CUDA 13.2 wheels).
ml = ["torch>=2.5", "faiss-cpu>=1.8"]  # faiss: Phase 3 retrieval (tested 1.15.1)
# Phase 7: Streamlit dashboard over cached results. Tested with 1.67.0 / 7.1.0.
dashboard = ["streamlit>=1.40", "plotly>=5.20", "faiss-cpu>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = ["*.md"]  # keep hand-aligned README code samples

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"]  # verbatim KITTI calib.txt lines

[tool.ruff.lint.isort]
known-first-party = ["latent_loop", "conftest"]
