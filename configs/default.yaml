# Latent-Loop default configuration.
# Relative paths are resolved against the repository root.

project:
  name: latent-loop
  seed: 0

paths:
  data_root: data
  raw_dir: data/raw
  processed_dir: data/processed
  cache_dir: data/cache
  checkpoints_dir: checkpoints
  results_dir: results
  assets_dir: assets

logging:
  level: INFO
  file: null          # e.g. results/latent_loop.log

dataset:
  name: synthetic     # synthetic | kitti
  sequence: "00"
  camera: 2           # KITTI camera index (0/1 grayscale, 2/3 colour)

  # Frame sampling applied on top of the raw sequence (original frame IDs are preserved).
  sampling:
    start: 0          # first original frame ID (inclusive)
    end: null         # last original frame ID (exclusive); null = end of sequence
    stride: 1         # keep frame IDs f with (f - start) % stride == 0
    max_frames: null  # cap on the number of sampled frames; null = no cap

  synthetic:
    seed: 7
    image_width: 416
    image_height: 128
    frame_spacing_m: 1.0
    frame_rate_hz: 10.0
    block_length_m: 120.0
    block_width_m: 80.0
    corner_radius_m: 15.0
    laps: 1.6         # >1 creates a revisited segment with known loop closures
    revisit_lateral_offset_m: 0.5
    camera_height_m: 1.65
    noise_std: 2.0

splits:                 # KITTI sequences with loop closures (Phase 5 onwards)
  # Development: thresholds, vocabularies and design choices may use these.
  # 00 is development because Phases 2-4 already inspected it; 05 fits the ORB vocabulary.
  dev: ["00", "05"]
  # Held out: never used for fitting or tuning; evaluated once in Phase 6.
  test: ["02", "06", "08", "09"]

device: auto            # auto | cuda | cpu (shared by all neural encoders)

extraction:             # shared by all encoders (Phase 2 onwards)
  batch_size: 8
  cpu_fallback: true
  flush_every: 256
  cache_root: data/cache/embeddings

hsv:                    # Phase 5 baseline: HSV colour histogram
  bins: [16, 4, 4]      # hue, saturation, value
  grid: [1, 1]          # columns, rows of spatial cells (1 x 1 = global histogram)
  work_width: 320       # images are resized to this width first

orb_bovw:               # Phase 5 baseline: ORB bag of visual words
  vocab_size: 1000
  n_features: 1000      # ORB keypoints per image
  tfidf: true
  fit_kitti_sequences: ["05"]  # development data only (checked against splits)
  fit_synthetic_seed: 11       # synthetic vocabulary: a different generated city
  fit_stride: 5                # frame stride of the KITTI fitting images
  fit_synthetic_stride: 1      # synthetic frames are low-texture (~270 ORB features each)
  max_fit_descriptors: 200000  # k-means sample
  seed: 0
  vocabulary_dir: data/cache/vocabulary

retrieval:              # Phase 3 (ground truth is never used here)
  top_k: 10
  temporal_exclusion_frames: 100   # in ORIGINAL frame IDs (10 s at KITTI's 10 Hz)
  temporal_exclusion_seconds: null # optional additional rule on timestamps
  min_similarity: null             # optional cosine threshold for candidates
  nms_frames: 0                    # temporal non-maximum suppression; 0 = off
  mode: offline                    # offline | causal

verification:           # Phase 4 (ground truth is never used here)
  verify_top_k: 5                  # candidates per query passed to geometric verification
  orb:
    n_features: 2000
    scale_factor: 1.2
    n_levels: 8
    edge_threshold: 31
    fast_threshold: 20
  matching:
    ratio: 0.8                     # Lowe ratio test d1 < ratio * d2
    max_hamming: 64                # absolute bound on the best Hamming distance (of 256 bits)
    mutual: true                   # cross-check: best match in both directions
  min_keypoints: 50                # per image, else "missing_descriptors"
  min_matches: 20                  # after ratio + mutual, else "insufficient_matches"
  twin_hamming: 24                 # self-similarity: a keypoint's "twin" in the same image ...
  twin_min_px: 16                  # ... is within 24 bits and at least 16 px away
  max_repeated_fraction: 0.5       # twin fraction in either image -> "repeated_structure"
  estimator: opencv                # opencv (5-point) | numpy (own 8-point RANSAC)
  ransac_threshold_px: 1.0         # Sampson distance threshold in pixels
  ransac_confidence: 0.999
  ransac_max_iters: 2000
  min_inliers: 30
  min_inlier_ratio: 0.3            # inliers / matches
  coverage_grid: [8, 4]            # columns, rows
  min_coverage: 0.1                # fraction of grid cells with an inlier (both images)
  homography_diagnostic: true
  homography_threshold_px: 2.0     # 2D transfer error (vs 1D Sampson for E), see README
  homography_dominance: 0.9        # n_H / n_E at or above -> degenerate configuration
  rotation_tolerance: 0.05         # singular-value spread of K^-1 H K for "rotation-like"
  pure_rotation_min_deg: 2.0
  min_parallax_deg: 1.0
  degenerate_policy: flag          # flag: accept, mark pose unreliable | reject
  seed: 0

ground_truth:           # labelling and evaluation only
  spatial_threshold_m: 5.0
  max_heading_diff_deg: 30.0       # second definition: same viewing direction

visualization:
  output_dir: assets/phase_01_dataset
  dpi: 120
  gif_fps: 10
  gif_width_px: 900
  gif_max_frames: 120
  sample_stride: 10  # stride used to illustrate frame sampling in Phase 1 plots
